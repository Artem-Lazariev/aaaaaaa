<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Students</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #121214;
      color: #e1e1e6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #202024;
      padding: 24px;
      border-radius: 8px;
    }

    h1, h2 {
      text-align: center;
      color: #00875f;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
      text-align: left;
    }

    button {
      background: #00875f;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00b37e;
    }

    .students-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
    }

    .student-card {
      background: #29292e;
      border: 1px solid #323238;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      width: 260px;
    }

    .student-card input {
      background: #121214;
      border: 1px solid #323238;
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      width: 100%;
    }

    form {
      background: #29292e;
      border: 1px solid #323238;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }

    form label {
      font-size: 13px;
      color: #a8a8b3;
    }

    form input[type="text"],
    form input[type="number"],
    form input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      background: #121214;
      border: 1px solid #323238;
      color: #fff;
      border-radius: 4px;
    }

    .action-btns {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action-btns button {
      padding: 6px 10px;
      font-size: 12px;
      flex: 1;
    }

    .delete-btn {
      background: #f75a68;
    }

    .delete-btn:hover {
      background: #e53e3e;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Список студентів</h1>
  <button id="get-students-btn">Отримати студентів</button>

  <div id="students-container" class="students-grid"></div>

  <h2>Додати нового студента</h2>
  <form id="add-student-form">
    <label>Ім'я <input type="text" id="name" required></label>
    <label>Вік <input type="number" id="age" required></label>
    <label>Курс <input type="text" id="course" required></label>
    <label>Навички <input type="text" id="skills" required></label>
    <label>Email <input type="email" id="email" required></label>
    <label>
      <input type="checkbox" id="isEnrolled"> Записаний на курс
    </label>
    <button id="sub" type="submit">Додати студента</button>
  </form>
</div>

<script src="index.js" type="module"></script>
</body>
</html>
